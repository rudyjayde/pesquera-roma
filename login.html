<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Iniciar Sesión — Pesquera La Pequeña Roma</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <style>
    *,*::before,*::after { box-sizing:border-box; margin:0; padding:0 }

    :root {
      --azul-prof: #03111f;
      --azul-mar:  #071529;
      --cyan:      #2e86c1;
      --cyan-cl:   #5dade2;
      --dorado:    #d4a843;
      --dorado-cl: #f0c060;
    }

    body {
      font-family: 'Montserrat', system-ui, sans-serif;
      background: linear-gradient(160deg, #03111f 0%, #071529 50%, #0a1f3d 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      position: relative;
      overflow: hidden;
    }

    /* Decorative fish background */
    .bg-fish {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 0;
    }
    .bg-fish svg {
      position: absolute;
      opacity: 0.04;
      animation: floatFish linear infinite;
    }
    .bg-fish svg:nth-child(1) { width:180px; top:10%; left:-80px; animation-duration:22s; animation-delay:0s; }
    .bg-fish svg:nth-child(2) { width:120px; top:40%; left:-60px; animation-duration:18s; animation-delay:-7s; }
    .bg-fish svg:nth-child(3) { width:220px; top:65%; left:-100px; animation-duration:25s; animation-delay:-12s; }
    @keyframes floatFish {
      0%   { transform: translateX(-200px); }
      100% { transform: translateX(calc(100vw + 200px)); }
    }

    /* Glow circles */
    .glow { position:fixed; border-radius:50%; filter:blur(80px); pointer-events:none; z-index:0; }
    .glow1 { width:400px; height:400px; background:rgba(46,134,193,0.08); top:-100px; right:-100px; }
    .glow2 { width:300px; height:300px; background:rgba(212,168,67,0.06); bottom:-80px; left:-80px; }

    /* ===== CARD ===== */
    .login-container {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 460px;
    }

    .login-card {
      background: rgba(255,255,255,0.97);
      border-radius: 28px;
      overflow: hidden;
      box-shadow: 0 28px 80px rgba(0,0,0,0.5);
    }

    /* Card header */
    .card-header {
      background: linear-gradient(135deg, #0a1f3d 0%, #1a5276 100%);
      padding: 36px 40px 32px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    .card-header::before {
      content: '';
      position: absolute;
      top: -40px;
      right: -40px;
      width: 160px;
      height: 160px;
      border-radius: 50%;
      background: rgba(93,173,226,0.12);
    }
    .card-header::after {
      content: '';
      position: absolute;
      bottom: -20px;
      left: -20px;
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: rgba(212,168,67,0.08);
    }
    .brand-logo {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: rgba(255,255,255,0.12);
      border: 2px solid rgba(255,255,255,0.2);
      margin-bottom: 14px;
    }
    .brand-logo svg { width: 32px; height: 32px; }
    .card-header h1 {
      font-family: 'Playfair Display', serif;
      color: #fff;
      font-size: 1.5rem;
      margin-bottom: 4px;
    }
    .card-header h1 em { color: var(--dorado-cl); font-style: italic; }
    .card-header p { color: rgba(255,255,255,0.55); font-size: 0.78rem; letter-spacing: 0.08em; text-transform: uppercase; }

    /* ===== TABS ===== */
    .tabs {
      display: flex;
      background: #f4f7fb;
      border-bottom: 1px solid #dde8f0;
    }
    .tab-btn {
      flex: 1;
      padding: 14px;
      background: none;
      border: none;
      font-family: 'Montserrat', sans-serif;
      font-size: 0.85rem;
      font-weight: 600;
      color: #7a96b0;
      cursor: pointer;
      transition: color 0.2s, background 0.2s;
      position: relative;
    }
    .tab-btn::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: var(--cyan);
      transform: scaleX(0);
      transition: transform 0.25s;
    }
    .tab-btn.active { color: #0a1f3d; background: #fff; }
    .tab-btn.active::after { transform: scaleX(1); }

    /* ===== FORM BODY ===== */
    .card-body { padding: 34px 40px; }

    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    .campo-grupo { margin-bottom: 18px; }
    .campo-grupo label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      color: #2a3f54;
      margin-bottom: 7px;
    }
    .campo-grupo input {
      width: 100%;
      padding: 12px 15px;
      border: 1.5px solid #d0dce8;
      border-radius: 10px;
      font-family: 'Montserrat', sans-serif;
      font-size: 0.9rem;
      color: #0a1f3d;
      background: #fafcff;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .campo-grupo input:focus {
      border-color: var(--cyan);
      box-shadow: 0 0 0 3px rgba(46,134,193,0.12);
      background: #fff;
    }

    .campo-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }

    .btn-submit {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #0a1f3d, #1a5276);
      color: #fff;
      border: none;
      border-radius: 50px;
      font-family: 'Montserrat', sans-serif;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      margin-top: 4px;
    }
    .btn-submit:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 8px 28px rgba(10,31,61,0.3);
    }
    .btn-submit:disabled { opacity: 0.55; cursor: not-allowed; transform: none; }

    .form-note {
      font-size: 0.78rem;
      color: #8aa0b4;
      text-align: center;
      margin-top: 14px;
      line-height: 1.6;
    }
    .form-note a { color: var(--cyan); font-weight: 600; text-decoration: none; }

    .msg-box {
      padding: 11px 15px;
      border-radius: 8px;
      font-size: 0.85rem;
      text-align: center;
      margin-bottom: 16px;
      display: none;
    }
    .msg-box.success { background:#eafaf1; color:#1e8449; border:1px solid #a9dfbf; }
    .msg-box.error   { background:#fef0f0; color:#c0392b; border:1px solid #f5c6c6; }

    /* Forgot password */
    .forgot-link {
      display: block;
      text-align: right;
      font-size: 0.78rem;
      color: var(--cyan);
      font-weight: 600;
      text-decoration: none;
      margin-top: -10px;
      margin-bottom: 18px;
    }
    .forgot-link:hover { text-decoration: underline; }

    /* Social divider */
    .social-divider {
      display: flex; align-items: center; gap: 10px; margin: 20px 0;
    }
    .social-divider::before, .social-divider::after {
      content: ''; flex: 1; height: 1px; background: #dde8f0;
    }
    .social-divider span { font-size: 0.75rem; color: #8aa0b4; white-space: nowrap; }

    /* WhatsApp alt button */
    .btn-wsp {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      width: 100%;
      padding: 12px;
      background: #fff;
      border: 1.5px solid #d0dce8;
      border-radius: 50px;
      font-family: 'Montserrat', sans-serif;
      font-size: 0.88rem;
      font-weight: 600;
      color: #2a3f54;
      text-decoration: none;
      transition: background 0.2s, border-color 0.2s;
    }
    .btn-wsp:hover { background: #f5f8fb; border-color: #25d366; color: #1a8440; }
    .btn-wsp svg { width: 20px; height: 20px; }

    /* ===== FOOTER CARD ===== */
    .card-footer {
      padding: 18px 40px;
      background: #f4f7fb;
      border-top: 1px solid #dde8f0;
      text-align: center;
      font-size: 0.8rem;
      color: #7a96b0;
    }
    .card-footer a { color: #0a1f3d; font-weight: 600; text-decoration: none; }
    .card-footer a:hover { color: var(--cyan); }

    /* ===== BACK NAV ===== */
    .back-nav {
      text-align: center;
      margin-top: 20px;
      font-size: 0.82rem;
    }
    .back-nav a {
      color: rgba(255,255,255,0.45);
      text-decoration: none;
      transition: color 0.2s;
    }
    .back-nav a:hover { color: rgba(255,255,255,0.8); }

    @media (max-width: 480px) {
      .card-header { padding: 28px 24px 24px; }
      .card-body   { padding: 26px 24px; }
      .card-footer { padding: 16px 24px; }
      .campo-row   { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <!-- Background decorations -->
  <div class="bg-fish">
    <svg viewBox="0 0 100 60" fill="rgba(93,173,226,1)">
      <path d="M5 30 C15 10, 40 5, 75 20 L92 30 L75 40 C40 55, 15 50, 5 30Z"/>
      <path d="M75 20 L98 8 L93 30 L98 52 L75 40"/>
    </svg>
    <svg viewBox="0 0 100 60" fill="rgba(93,173,226,1)">
      <path d="M5 30 C15 10, 40 5, 75 20 L92 30 L75 40 C40 55, 15 50, 5 30Z"/>
      <path d="M75 20 L98 8 L93 30 L98 52 L75 40"/>
    </svg>
    <svg viewBox="0 0 100 60" fill="rgba(93,173,226,1)">
      <path d="M5 30 C15 10, 40 5, 75 20 L92 30 L75 40 C40 55, 15 50, 5 30Z"/>
      <path d="M75 20 L98 8 L93 30 L98 52 L75 40"/>
    </svg>
  </div>
  <div class="glow glow1"></div>
  <div class="glow glow2"></div>

  <div class="login-container">
    <div class="login-card">

      <!-- Header -->
      <div class="card-header">
        <div class="brand-logo">
          <svg viewBox="0 0 48 36" fill="none">
            <path d="M4 18 C10 6, 24 2, 38 10 L44 18 L38 26 C24 34, 10 30, 4 18Z"
                  fill="rgba(93,173,226,0.9)"/>
            <path d="M38 10 L46 4 L43 18 L46 32 L38 26"
                  fill="rgba(46,134,193,0.7)"/>
            <circle cx="12" cy="16" r="2.5" fill="#d4a843"/>
          </svg>
        </div>
        <h1>Pequeña <em>Roma</em></h1>
        <p>Tu cuenta de cliente</p>
      </div>

      <!-- Tabs -->
      <div class="tabs">
        <button class="tab-btn active" data-tab="login">Iniciar Sesión</button>
        <button class="tab-btn" data-tab="register">Crear Cuenta</button>
      </div>

      <!-- Body -->
      <div class="card-body">

        <!-- LOGIN PANEL -->
        <div class="tab-panel active" id="panel-login">
          <div class="msg-box" id="loginMsg"></div>

          <form id="formLogin">
            <div class="campo-grupo">
              <label for="loginEmail">Correo electrónico</label>
              <input type="email" id="loginEmail" placeholder="tu@correo.com"
                     required autocomplete="username"/>
            </div>
            <div class="campo-grupo">
              <label for="loginPass">Contraseña</label>
              <input type="password" id="loginPass" placeholder="••••••••"
                     required autocomplete="current-password"/>
            </div>
            <button type="submit" class="btn-submit" id="btnLogin">Iniciar Sesión</button>
          </form>

          <div class="social-divider"><span>¿Primera vez aquí?</span></div>

          <a href="https://wa.me/51936859812?text=Hola%2C%20quisiera%20consultar%20sobre%20sus%20productos"
             target="_blank" class="btn-wsp">
            <svg viewBox="0 0 24 24" fill="#25d366">
              <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z"/>
              <path d="M12 0C5.373 0 0 5.373 0 12c0 2.122.555 4.112 1.523 5.836L.057 23.492a.5.5 0 00.612.612l5.656-1.466A11.943 11.943 0 0012 24c6.627 0 12-5.373 12-12S18.627 0 12 0zm0 21.882a9.868 9.868 0 01-5.034-1.38l-.36-.214-3.733.968.99-3.617-.235-.372A9.865 9.865 0 012.118 12C2.118 6.526 6.526 2.118 12 2.118S21.882 6.526 21.882 12 17.474 21.882 12 21.882z"/>
            </svg>
            Consultar por WhatsApp
          </a>

          <p class="form-note">
            ¿Problema para ingresar?
            <a href="https://wa.me/51936859812" target="_blank">Contáctanos</a>
          </p>
        </div>

        <!-- REGISTER PANEL -->
        <div class="tab-panel" id="panel-register">
          <div class="msg-box" id="registerMsg"></div>

          <form id="formRegister">
            <div class="campo-row">
              <div class="campo-grupo">
                <label for="regNombre">Nombre</label>
                <input type="text" id="regNombre" placeholder="Juan" required/>
              </div>
              <div class="campo-grupo">
                <label for="regApellido">Apellido</label>
                <input type="text" id="regApellido" placeholder="García"/>
              </div>
            </div>
            <div class="campo-grupo">
              <label for="regEmail">Correo electrónico</label>
              <input type="email" id="regEmail" placeholder="tu@correo.com"
                     required autocomplete="email"/>
            </div>
            <div class="campo-grupo">
              <label for="regTelefono">Teléfono (opcional)</label>
              <input type="tel" id="regTelefono" placeholder="+51 999 999 999"/>
            </div>
            <div class="campo-grupo">
              <label for="regPass">Contraseña</label>
              <input type="password" id="regPass" placeholder="Mínimo 6 caracteres"
                     required minlength="6" autocomplete="new-password"/>
            </div>
            <button type="submit" class="btn-submit" id="btnRegister">Crear Cuenta</button>
          </form>

          <p class="form-note">
            Al registrarte aceptas nuestros
            <a href="terminos.html" target="_blank">Términos y Condiciones</a>
            y la
            <a href="terminos.html#privacidad" target="_blank">Política de Privacidad</a>.
          </p>
        </div>

      </div><!-- /card-body -->

      <div class="card-footer">
        <a href="index.html">← Volver al sitio web</a>
        &nbsp;·&nbsp;
        <a href="reclamaciones.html">Libro de Reclamaciones</a>
      </div>
    </div><!-- /login-card -->

    <div class="back-nav">
      <a href="index.html">← Regresar a la página principal</a>
    </div>
  </div>

  <script>
    /* ===== Tabs ===== */
    const tabBtns   = document.querySelectorAll('.tab-btn');
    const tabPanels = document.querySelectorAll('.tab-panel');

    tabBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        const target = btn.dataset.tab;
        tabBtns.forEach(b => b.classList.remove('active'));
        tabPanels.forEach(p => p.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById('panel-' + target).classList.add('active');
      });
    });

    /* ===== Login Form ===== */
    document.getElementById('formLogin').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email    = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPass').value;
      const msgDiv   = document.getElementById('loginMsg');
      const btn      = document.getElementById('btnLogin');

      showMsg(msgDiv, '', '');
      btn.disabled    = true;
      btn.textContent = 'Verificando...';

      try {
        const res  = await fetch('/api/auth/login', {
          method:  'POST',
          headers: { 'Content-Type': 'application/json' },
          body:    JSON.stringify({ email, password })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Credenciales incorrectas');

        localStorage.setItem('user_token', data.token);
        localStorage.setItem('user_data',  JSON.stringify(data.user));
        showMsg(msgDiv, '✅ ¡Bienvenido! Redirigiendo...', 'success');
        setTimeout(() => { window.location.href = 'index.html'; }, 1200);

      } catch (err) {
        showMsg(msgDiv, err.message, 'error');
        btn.disabled    = false;
        btn.textContent = 'Iniciar Sesión';
      }
    });

    /* ===== Register Form ===== */
    document.getElementById('formRegister').addEventListener('submit', async (e) => {
      e.preventDefault();
      const nombre   = document.getElementById('regNombre').value.trim();
      const apellido = document.getElementById('regApellido').value.trim();
      const email    = document.getElementById('regEmail').value.trim();
      const telefono = document.getElementById('regTelefono').value.trim();
      const password = document.getElementById('regPass').value;
      const msgDiv   = document.getElementById('registerMsg');
      const btn      = document.getElementById('btnRegister');

      showMsg(msgDiv, '', '');
      btn.disabled    = true;
      btn.textContent = 'Creando cuenta...';

      try {
        const res  = await fetch('/api/auth/register', {
          method:  'POST',
          headers: { 'Content-Type': 'application/json' },
          body:    JSON.stringify({ nombre: `${nombre} ${apellido}`.trim(), email, telefono, password })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'No se pudo crear la cuenta');

        showMsg(msgDiv, '✅ Cuenta creada. Ahora puedes iniciar sesión.', 'success');
        document.getElementById('formRegister').reset();
        setTimeout(() => {
          tabBtns[0].click();
          document.getElementById('loginEmail').value = email;
        }, 1800);

      } catch (err) {
        showMsg(msgDiv, err.message, 'error');
        btn.disabled    = false;
        btn.textContent = 'Crear Cuenta';
      }
    });

    function showMsg(el, text, type) {
      if (!text) { el.style.display = 'none'; return; }
      el.className = 'msg-box ' + type;
      el.textContent = text;
      el.style.display = 'block';
    }
  </script>
</body>
</html>
